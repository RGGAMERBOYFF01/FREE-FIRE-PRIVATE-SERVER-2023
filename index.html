<div id="captcha-overlay" class="captcha-overlay" aria-hidden="true">
  <div class="captcha-box" role="dialog" aria-modal="true" aria-label="Verification">
    <button id="captcha-close" class="captcha-close" type="button" aria-label="Close">×</button>
    <div id="hcaptcha-holder"></div>
  </div>
</div>
<script>
  (function(){
    const SITE_KEY = "75a41e52-548a-44c2-af8c-43ac16a25fa0";
    const overlay = document.getElementById("captcha-overlay");
    const holder = document.getElementById("hcaptcha-holder");
    const closeButton = document.getElementById("captcha-close");
    let pendingUrl = "";
    let widgetId = null;
    let renderRequested = false;

    function closeCaptcha(){
      overlay.classList.remove("open");
      overlay.setAttribute("aria-hidden", "true");
      pendingUrl = "";
      if (window.hcaptcha && widgetId !== null) {
        try { window.hcaptcha.reset(widgetId); } catch(e) {}
      }
    }

    function onVerified(){
      const destination = pendingUrl;
      if (!destination) return;
      // Allow hCaptcha to show its own verified state before navigation.
      window.setTimeout(function(){
        if (pendingUrl !== destination) return;
        window.location.href = destination;
      }, 1500);
    }

    function renderWidget(){
      if (!window.hcaptcha || renderRequested) return;
      renderRequested = true;
      widgetId = window.hcaptcha.render(holder, {
        sitekey: SITE_KEY,
        callback: onVerified,
        "error-callback": function(){},
        "expired-callback": function(){ pendingUrl = ""; }
      });
    }

    window.hcaptchaOnLoad = renderWidget;
    const script = document.createElement("script");
    script.src = "https://js.hcaptcha.com/1/api.js?onload=hcaptchaOnLoad&render=explicit";
    script.async = true;
    script.defer = true;
    document.head.appendChild(script);

    document.addEventListener("click", function(event){
      const link = event.target.closest("a[href]");
      if (!link) return;
      const href = link.getAttribute("href");
      if (!href || href.startsWith("#") || link.hasAttribute("data-no-captcha")) return;
      // Apply the challenge only to the download links and Discord invite.
      const isDownload = link.closest("#downloads") && (
        link.getAttribute("aria-label") === "Download FF Private Server 2023 Android" ||
        link.getAttribute("aria-label") === "Download FF Private Server 2023 iOS"
      );
      const isDiscord = link.getAttribute("aria-label") === "Join Your Discord";
      if (!isDownload && !isDiscord) return;

      event.preventDefault();
      pendingUrl = link.href;
      overlay.classList.add("open");
      overlay.setAttribute("aria-hidden", "false");
      renderWidget();
      if (window.hcaptcha && widgetId !== null) {
        try { window.hcaptcha.reset(widgetId); } catch(e) {}
      }
    });

    closeButton.addEventListener("click", closeCaptcha);
    overlay.addEventListener("click", function(event){
      if (event.target === overlay) closeCaptcha();
    });
    document.addEventListener("keydown", function(event){
      if (event.key === "Escape" && overlay.classList.contains("open")) closeCaptcha();
    });
  })();
</script>
